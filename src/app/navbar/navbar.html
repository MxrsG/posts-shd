@if (auth.isAuthenticated()) {
  <nav class="navbar navbar-expand bg-dark navbar-dark">
    <div class="container d-flex justify-content-between gap-2">
      <a class="navbar-brand fw-semibold" routerLink="/panel">FaceLibro</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white-50 d-none d-sm-inline">{{ auth.username() }}</span>
        <button type="button" class="btn btn-outline-light btn-sm" (click)="salir()">Cerrar sesión</button>
      </div>
    </div>
  </nav>
}
